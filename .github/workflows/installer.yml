name: Build private desktop installers
on:
  workflow_dispatch:
    inputs:
      platform:
        description: Native platform to build
        type: choice
        default: both
        options: [both, macos, windows]
permissions:
  contents: read
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        os: ${{ fromJSON(inputs.platform == 'macos' && '["macos-latest"]' || inputs.platform == 'windows' && '["windows-latest"]' || '["macos-latest","windows-latest"]') }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install pyinstaller==6.22.3
      - if: runner.os == 'macOS'
        run: python -m pip install dmgbuild==1.6.7 Pillow==12.1.1
      - run: python -m unittest discover -s tests -p test_installer.py -v
      - name: Build and launch bundled Python/Tk installer
        run: python scripts/build_installer.py --output "${{ runner.temp }}/fmj-native"
      - uses: actions/upload-artifact@v4
        with:
          name: installer-${{ matrix.os }}
          path: |
            ${{ runner.temp }}/fmj-native/*.dmg
            ${{ runner.temp }}/fmj-native/*.exe
            ${{ runner.temp }}/fmj-native/*manifest.json
            ${{ runner.temp }}/fmj-native/bundle-smoke.json
          if-no-files-found: error
  update-download-links:
    needs: native
    if: ${{ github.ref_name == github.event.repository.default_branch }}
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: write
    concurrency:
      group: installer-readme-links
      cancel-in-progress: false
    steps:
      - name: Update README with the completed installer downloads
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo;
            const branch = context.payload.repository.default_branch;
            const { data: { artifacts } } = await github.rest.actions.listWorkflowRunArtifacts({
              owner, repo, run_id: context.runId, per_page: 100
            });
            const { data: readme } = await github.rest.repos.getContent({
              owner, repo, path: 'README.md', ref: branch
            });
            let content = Buffer.from(readme.content, 'base64').toString('utf8');
            const original = content;
            for (const [name, label] of [
              ['installer-macos-latest', 'macOS (.dmg)'],
              ['installer-windows-latest', 'Windows (.exe)']
            ]) {
              const artifact = artifacts.find(item => item.name === name && !item.expired);
              if (!artifact) continue;
              const prefix = `[${label}](https://github.com/${owner}/${repo}/actions/runs/`;
              const start = content.indexOf(prefix);
              if (start < 0) throw new Error(`Missing README download link: ${label}`);
              const end = content.indexOf(')', start + prefix.length);
              const previous = content.slice(start + prefix.length, end);
              if (!/^\d+\/artifacts\/\d+$/.test(previous)) {
                throw new Error(`Invalid README download link: ${label}`);
              }
              if (Number(previous.split('/')[0]) > context.runId) continue;
              const link = `${prefix}${context.runId}/artifacts/${artifact.id})`;
              content = content.slice(0, start) + link + content.slice(end + 1);
            }
            if (content === original) return;
            await github.rest.repos.createOrUpdateFileContents({
              owner, repo, branch, path: 'README.md', sha: readme.sha,
              message: 'Update installer download links\n\nPoint README downloads to the successful native build artifacts.',
              content: Buffer.from(content).toString('base64')
            });
